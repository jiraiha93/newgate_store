    <script>
        document.getElementById('current-year').innerText = new Date().getFullYear();

        const Toast = Swal.mixin({
            toast: true, position: 'top', showConfirmButton: false, timer: 3000,
            background: '#0f0f0f', color: '#fff', iconColor: '#d4af37',
            customClass: { popup: 'border border-white/10 rounded-lg shadow-2xl !py-2 !px-4 !w-auto', title: '!text-[11px] !font-bold tracking-widest uppercase' }
        });

        const DEFAULT_CONFIG = {
            slogan: "Nuestras piezas exclusivas",
            aboutTitle: "Legacy Over Size",
            aboutDesc: "New Gate no es una marca, es un destino. Diseñamos para la tripulación que prefiere el asfalto y el estilo que no se rinde ante el tiempo.",
            whatsapp: "50400000000", instagram: "#", facebook: "#",
            categories: ["urban", "anime", "autos"],
            heroTitle: "ESTILO SIN LÍMITES", heroSubtitle: "STREETWEAR EXCLUSIVO NEW GATE", heroImage: ""
        };

        let inventario = [];
        let config = { ...DEFAULT_CONFIG };
        let carrito = [];
        let currentModalImages = [];
        let currentImageIndex = 0;
        let hasCheckedUrlParams = false; 
        
        // Variables para el control de cantidad y touch (swipe)
        let productQuantity = 1;
        let touchStartX = 0;
        let touchEndX = 0;

        function init() {
            applyConfig();
            escucharFirebase(); 
            escucharHero();
            escucharConfigGlobal(); 
            renderCarrito();
        }

        function escucharConfigGlobal() {
            db.collection("config").doc("global").onSnapshot((doc) => {
                if (doc.exists) { config = { ...config, ...doc.data() }; applyConfig(); renderFilters(); } 
                else { applyConfig(); renderFilters(); }
            });
        }

        function escucharFirebase() {
            db.collection("productos").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                inventario = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderGallery();
                
                if (!hasCheckedUrlParams && inventario.length > 0) {
                    const params = new URLSearchParams(window.location.search);
                    const prodId = params.get('producto');
                    if (prodId) {
                        const productExists = inventario.find(p => p.id === prodId);
                        if (productExists) setTimeout(() => openModalById(prodId), 400); 
                        else { Toast.fire({ icon: 'error', title: 'El producto ya no está disponible' }); window.history.pushState({}, '', window.location.pathname); }
                    }
                    hasCheckedUrlParams = true;
                }
            }, (error) => console.error("❌ Error Firebase:", error));
        }

        function escucharHero() {
            db.collection("config").doc("hero").onSnapshot((doc) => {
                if (doc.exists) { config = { ...config, ...doc.data() }; applyConfig(); }
            });
        }

        function showSection(id) {
            document.querySelectorAll('.section-fade').forEach(s => { s.classList.remove('active'); s.style.display = 'none'; });
            const target = document.getElementById(id);
            if(target) { target.style.display = 'block'; setTimeout(() => target.classList.add('active'), 50); }
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            if(!grid) return;
            
            if(inventario.length === 0) {
                 grid.innerHTML = '<div class="col-span-full text-center py-20"><i class="fas fa-box-open text-4xl text-white/10 mb-4 block"></i><p class="text-gray-600 uppercase tracking-widest text-[10px] font-bold">Catálogo vacío por el momento</p></div>';
            } else {
                grid.innerHTML = inventario.map(prod => {
                    const coverImg = prod.imagenes && prod.imagenes.length > 0 ? prod.imagenes[0] : prod.imagen;
                    
                    return `
                    <div class="gallery-item group cursor-pointer animate-in fade-in duration-500" data-category="${prod.categoria || 'general'}">
                        <div class="relative aspect-[3/4] overflow-hidden bg-darker border border-white/5 shadow-2xl">
                            <img src="${coverImg}" loading="lazy" alt="${prod.titulo}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105">
                            <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
                            
                            ${prod.imagenes && prod.imagenes.length > 1 ? `<div class="absolute top-2 right-2 bg-dark/70 text-white text-[9px] px-2 py-1 rounded font-bold"><i class="fas fa-clone"></i> ${prod.imagenes.length}</div>` : ''}

                            <div class="absolute bottom-4 left-4 right-4 translate-y-12 group-hover:translate-y-0 transition-transform duration-500 ease-out">
                                <button onclick="openModalById('${prod.id}')" class="w-full bg-white text-dark py-3 font-bold uppercase text-[10px] tracking-widest hover:bg-primary transition-colors shadow-lg">Ver Detalles</button>
                            </div>
                        </div>
                        <div class="mt-4 flex justify-between items-start">
                            <div class="overflow-hidden">
                                <h3 class="text-white font-medium uppercase tracking-widest text-sm truncate pr-2">${prod.titulo}</h3>
                                <p class="text-gray-500 text-[9px] uppercase font-bold mt-1">${prod.sku ? prod.sku + ' | ' : ''}${prod.categoria || 'General'}</p>
                            </div>
                            <span class="text-primary font-bold whitespace-nowrap">${prod.precio}</span>
                        </div>
                    </div>
                `}).join('');
            }
            renderFilters();
        }

        function renderFilters() {
            const filters = document.getElementById('filter-container');
            if(!filters) return;
            const catsToUse = config.categories || [];
            filters.innerHTML = `
                <button onclick="filterGallery('all', event)" class="filter-btn text-primary border-b border-primary pb-1 transition-all font-bold">Todos</button>
                ${catsToUse.map(cat => `<button onclick="filterGallery('${cat}', event)" class="filter-btn hover:text-white pb-1 transition-all uppercase font-bold text-gray-500">${cat}</button>`).join('')}
            `;
        }

        function filterGallery(cat, e) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('text-primary', 'border-primary', 'font-bold'); b.classList.add('text-gray-500');
            });
            e.target.classList.remove('text-gray-500'); e.target.classList.add('text-primary', 'border-primary', 'font-bold');
            
            const grid = document.getElementById('gallery-grid');
            grid.style.opacity = '0';
            
            setTimeout(() => {
                document.querySelectorAll('.gallery-item').forEach(item => {
                    item.style.display = (cat === 'all' || item.dataset.category === cat) ? 'block' : 'none';
                });
                grid.style.opacity = '1';
            }, 300);
        }

        function openModalById(id) {
            const p = inventario.find(x => x.id === id);
            if(!p) return;
            window.lastViewedProduct = p;
            window.history.pushState({ productId: id }, '', `?producto=${id}`);

            // Resetear cantidad al abrir modal
            productQuantity = 1;
            document.getElementById('modal-quantity').innerText = productQuantity;

            currentModalImages = p.imagenes && p.imagenes.length > 0 ? p.imagenes : [p.imagen];
            currentImageIndex = 0;
            updateCarouselView();

            document.getElementById('modal-title').innerText = p.titulo;
            document.getElementById('modal-sku-display').innerText = p.sku ? `SKU: ${p.sku}` : '';
            document.getElementById('modal-desc').innerText = p.descripcion;
            document.getElementById('modal-price').innerText = p.precio;
            document.getElementById('modal-cat').innerText = p.categoria || 'General';
            
            const measuresContainer = document.getElementById('modal-measures-container');
            const tallaSelectContainer = document.getElementById('modal-talla-select-container');
            
            if(p.hasMeasures && p.tallas && p.tallas.length > 0) {
                measuresContainer.classList.remove('hidden');
                document.getElementById('modal-measures-body').innerHTML = p.tallas.map(t => {
                    const m = p.medidas && p.medidas[t] ? p.medidas[t] : {pecho:'-', largo:'-', ancho:'-'};
                    return `<tr class="hover:bg-white/5 transition-colors"><td class="py-3 px-2 text-primary font-bold">${t}</td><td class="py-3 text-center text-gray-400 font-bold">${m.pecho}</td><td class="py-3 text-center text-gray-400 font-bold">${m.largo}</td><td class="py-3 text-center text-gray-400 font-bold">${m.ancho}</td></tr>`;
                }).join('');
                
                tallaSelectContainer.classList.remove('hidden');
                document.getElementById('modal-talla').innerHTML = '<option value="" disabled selected>Elige una talla</option>' + p.tallas.map(t => `<option value="${t}">${t}</option>`).join('');
                document.getElementById('modal-talla').classList.remove('border-red-500');
            } else {
                measuresContainer.classList.add('hidden');
                tallaSelectContainer.classList.add('hidden');
            }
            
            document.getElementById('product-modal').classList.add('active');
        }

        // --- LÓGICA DE ACTUALIZACIÓN DE CANTIDAD ---
        function updateQuantity(change) {
            productQuantity += change;
            if(productQuantity < 1) productQuantity = 1; // Mínimo 1 producto
            if(productQuantity > 20) productQuantity = 20; // Límite por precaución
            document.getElementById('modal-quantity').innerText = productQuantity;
        }

        // --- LÓGICA DE SWIPE (TACTIL) PARA CARRUSEL ---
        function handleTouchStart(e) {
            touchStartX = e.changedTouches[0].screenX;
        }

        function handleTouchEnd(e) {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }

        function handleSwipe() {
            if(currentModalImages.length <= 1) return;
            const swipeThreshold = 50; // Pixeles mínimos para considerar swipe
            if (touchEndX < touchStartX - swipeThreshold) changeImage(1); // Swipe Izquierda -> Siguiente
            if (touchEndX > touchStartX + swipeThreshold) changeImage(-1); // Swipe Derecha -> Anterior
        }

        function shareProduct() {
            const url = window.location.href;
            if (navigator.share) navigator.share({ title: `NEW GATE: ${window.lastViewedProduct.titulo}`, text: '¡Mira este drop exclusivo!', url: url }).catch(console.error);
            else navigator.clipboard.writeText(url).then(() => Toast.fire({ icon: 'success', title: 'Enlace copiado al portapapeles' }));
        }

        function closeModal(e) { 
            window.history.pushState({}, '', window.location.pathname);
            document.getElementById('product-modal').classList.remove('active'); 
        }

        window.addEventListener('popstate', (event) => {
            const params = new URLSearchParams(window.location.search);
            const prodId = params.get('producto');
            if(prodId) openModalById(prodId); else document.getElementById('product-modal').classList.remove('active');
        });

        function changeImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex >= currentModalImages.length) currentImageIndex = 0;
            if (currentImageIndex < 0) currentImageIndex = currentModalImages.length - 1;
            updateCarouselView();
        }

        // --- CARGA DE IMAGEN MEJORADA (TRANSICIÓN SUAVE ANTI-FLASH) ---
        function updateCarouselView() {
            const imgElement = document.getElementById('modal-img');
            const loader = document.getElementById('modal-img-loader');
            
            // Ocultar imagen actual y mostrar loader leve
            imgElement.style.opacity = 0;
            loader.classList.remove('hidden');
            
            // Pre-cargar la nueva imagen en memoria antes de inyectarla al DOM
            const newImg = new Image();
            newImg.src = currentModalImages[currentImageIndex];
            
            newImg.onload = () => {
                imgElement.src = newImg.src;
                loader.classList.add('hidden');
                imgElement.style.opacity = 1; // Fade in por CSS
            };

            const prevBtn = document.getElementById('btn-prev-img');
            const nextBtn = document.getElementById('btn-next-img');
            const dotsContainer = document.getElementById('carousel-dots');

            if (currentModalImages.length > 1) {
                prevBtn.classList.remove('hidden'); nextBtn.classList.remove('hidden');
                dotsContainer.innerHTML = currentModalImages.map((_, idx) => `<span class="dot ${idx === currentImageIndex ? 'active' : ''}"></span>`).join('');
            } else {
                prevBtn.classList.add('hidden'); nextBtn.classList.add('hidden'); dotsContainer.innerHTML = ''; 
            }
        }

        // --- LÓGICA DE CARRITO ACTUALIZADA PARA AGRUPAR POR CANTIDAD ---
        function agregarAlPedido() {
            const p = window.lastViewedProduct;
            let tallaElegida = "Única";
            
            if (p.hasMeasures && p.tallas && p.tallas.length > 0) {
                const select = document.getElementById('modal-talla');
                if (!select.value) {
                    select.classList.add('border-red-500');
                    setTimeout(() => select.classList.remove('border-red-500'), 1500);
                    Toast.fire({ icon: 'warning', title: 'Debes seleccionar una talla' });
                    return;
                }
                tallaElegida = select.value;
            }

            // Verificar si el producto con la misma talla ya existe en el carrito
            const existingItemIndex = carrito.findIndex(item => item.id === p.id && item.talla === tallaElegida);

            if (existingItemIndex !== -1) {
                // Si existe, sumar la cantidad
                carrito[existingItemIndex].cantidad += productQuantity;
            } else {
                // Si no existe, agregarlo como nuevo elemento con su cantidad
                carrito.push({
                    id: p.id,
                    titulo: p.titulo,
                    sku: p.sku || '',
                    precio: p.precio,
                    talla: tallaElegida,
                    cantidad: productQuantity, // Guardamos la cantidad
                    img: p.imagenes && p.imagenes.length > 0 ? p.imagenes[0] : p.imagen
                });
            }

            const btn = document.getElementById('btn-add-cart');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-check"></i> ¡Añadido (${productQuantity})!`;
            btn.classList.add('bg-white');
            
            renderCarrito();
            
            Toast.fire({ icon: 'success', title: 'Añadido a tu pedido' });

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-white');
                closeModal();
            }, 1000);
        }

        function eliminarDelPedido(index) {
            carrito.splice(index, 1);
            renderCarrito();
            Toast.fire({ icon: 'info', title: 'Artículo removido' });
        }

        function renderCarrito() {
            // Contamos el total de items basados en la cantidad sumada
            const totalItems = carrito.reduce((acc, item) => acc + item.cantidad, 0);
            
            document.getElementById('cart-count').innerText = totalItems;
            document.getElementById('cart-count-mobile').innerText = totalItems;
            
            const container = document.getElementById('carrito-list');
            const totalContainer = document.getElementById('cart-total');
            
            if (carrito.length === 0) {
                container.innerHTML = `
                <div class="text-center py-6 border border-dashed border-white/10 rounded">
                    <i class="fas fa-shopping-bag text-2xl text-white/10 mb-2"></i>
                    <p class="text-gray-500 text-[10px] uppercase tracking-widest font-bold">Tu carrito está vacío</p>
                </div>`;
                totalContainer.innerText = "L0.00";
                return;
            }

            let total = 0;

            container.innerHTML = carrito.map((item, index) => {
                // Calcular el precio numérico y multiplicarlo por la cantidad
                const precioNum = parseFloat(item.precio.replace(/[^0-9.-]+/g,"")) || 0;
                const subtotalItem = precioNum * item.cantidad;
                total += subtotalItem;

                return `
                <div class="flex items-center gap-4 bg-darker border border-white/5 p-3 rounded group relative">
                    <div class="w-12 h-12 bg-dark rounded border border-white/10 overflow-hidden shrink-0 relative">
                        <img src="${item.img}" class="w-full h-full object-cover">
                        <div class="absolute bottom-0 right-0 bg-primary text-dark text-[8px] font-bold px-1 rounded-tl">x${item.cantidad}</div>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white text-[11px] font-bold uppercase truncate">${item.titulo}</p>
                        <div class="flex justify-between items-center mt-0.5">
                            <p class="text-gray-500 text-[9px] uppercase">Talla: <span class="text-white font-bold">${item.talla}</span> ${item.sku ? `| SKU: ${item.sku}` : ''}</p>
                            <p class="text-primary text-[10px] font-bold">L${subtotalItem.toFixed(2)}</p>
                        </div>
                    </div>
                    <button onclick="eliminarDelPedido(${index})" class="text-red-500 hover:text-red-400 bg-red-500/10 w-8 h-8 rounded shrink-0 transition-colors">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            `}).join('');

            totalContainer.innerText = `L${total.toFixed(2)}`;
        }

        function enviarWhatsApp() {
            const n = document.getElementById('nombre').value.trim();
            const m = document.getElementById('mensaje').value.trim();
            
            if(!n) { Toast.fire({ icon: 'warning', title: 'Por favor, ingresa tu Nombre' }); return document.getElementById('nombre').focus(); }
            if(carrito.length === 0) { Toast.fire({ icon: 'error', title: 'Tu carrito está vacío' }); return; }
            
            const btnText = document.getElementById('btn-wa-text');
            const originalText = btnText.innerText;
            btnText.innerText = "Procesando...";
            
            let msg = `🔥 *NUEVO PEDIDO NEW GATE* 🔥\n\n`;
            msg += `👤 *Cliente:* ${n}\n\n`;
            msg += `🛍️ *PRODUCTOS SELECCIONADOS:*\n`;
            
            let total = 0;

            carrito.forEach((item, index) => {
                const precioNum = parseFloat(item.precio.replace(/[^0-9.-]+/g,"")) || 0;
                const subtotalItem = precioNum * item.cantidad;
                total += subtotalItem;
                
                // Formato con Cantidad
                msg += `${index + 1}. [x${item.cantidad}] ${item.titulo} ${item.sku ? `(SKU: ${item.sku})` : ''} \n   📏 Talla: *${item.talla}* | 💰 L${subtotalItem.toFixed(2)}\n`;
            });

            msg += `\n💵 *TOTAL ESTIMADO: L${total.toFixed(2)}*\n`;

            if(m) msg += `\n💬 *Mensaje Adicional:*\n_${m}_\n`;
            msg += `\n_Enviado desde la tienda web_`;
            
            setTimeout(() => {
                window.open(`https://wa.me/${config.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
                btnText.innerText = originalText;
                Toast.fire({ icon: 'success', title: 'Abriendo WhatsApp...' });
            }, 800);
        }

        function applyConfig() {
            document.getElementById('display-hero-title').innerText = config.heroTitle;
            document.getElementById('display-hero-subtitle').innerText = config.heroSubtitle;
            document.getElementById('hero-display').style.backgroundImage = `url('${config.heroImage}')`;
            document.getElementById('display-shop-slogan').innerText = config.slogan;
            document.getElementById('display-about-title').innerText = config.aboutTitle;
            document.getElementById('display-about-desc').innerText = config.aboutDesc;
            
            const waLink = document.getElementById('link-whatsapp'); if(waLink) waLink.href = `https://wa.me/${config.whatsapp}`;
            const igLink = document.getElementById('link-instagram'); if(igLink) { igLink.href = config.instagram !== "#" ? config.instagram : "#"; igLink.style.display = config.instagram === "#" || !config.instagram ? "none" : "inline-block"; }
            const fbLink = document.getElementById('link-facebook'); if(fbLink) { fbLink.href = config.facebook !== "#" ? config.facebook : "#"; fbLink.style.display = config.facebook === "#" || !config.facebook ? "none" : "inline-block"; }
        }

        window.onload = init;
    </script>
</body>
</html>
