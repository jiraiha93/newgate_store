    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Permanent+Marker&display=swap');
        
        .section-fade {
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }
        
        .section-fade.active {
            display: block;
            opacity: 1;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 200;
            backdrop-filter: blur(12px);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #0f0f0f;
            border: 1px solid rgba(212, 175, 55, 0.2);
            /* CAMBIO: Se hizo el modal más amplio para ver mejor las fotos (1200px) */
            max-width: 1200px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .hero-bg {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .hero-overlay {
            background: linear-gradient(
                to bottom, 
                rgba(10, 10, 10, 0.1) 0%, 
                rgba(10, 10, 10, 0.7) 60%, 
                rgba(10, 10, 10, 1) 100%
            );
        }

        .hero-text-shadow {
            text-shadow: 0px 4px 20px rgba(0,0,0,0.9);
        }

        .loader {
            border: 3px solid rgba(212, 175, 55, 0.3);
            border-radius: 50%;
            border-top: 3px solid #d4af37;
            width: 20px;
            height: 20px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .dot {
            height: 6px;
            width: 6px;
            background-color: rgba(255,255,255,0.3);
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.3s ease;
        }
        .dot.active {
            background-color: #d4af37;
            width: 12px;
            border-radius: 4px;
        }
    </style>
</head>

    <script>
        document.getElementById('current-year').innerText = new Date().getFullYear();

        // --- ESTADO GLOBAL Y CONFIGURACIÓN ---
        const DEFAULT_CONFIG = {
            slogan: "Nuestras piezas exclusivas",
            aboutTitle: "Legacy Over Size",
            aboutDesc: "New Gate no es una marca, es un destino. Diseñamos para la tripulación que prefiere el asfalto y el estilo que no se rinde ante el tiempo.",
            whatsapp: "50400000000",
            instagram: "#",
            facebook: "#",
            categories: ["urban", "anime", "autos"],
            heroTitle: "ESTILO SIN LÍMITES",
            heroSubtitle: "STREETWEAR EXCLUSIVO NEW GATE",
            heroImage: ""
        };

        let inventario = [];
        let config = { ...DEFAULT_CONFIG };
        
        // --- SISTEMA DE CARRITO (NUEVO) ---
        let carrito = [];
        
        let currentModalImages = [];
        let currentImageIndex = 0;

        // --- ARRANQUE ---
        function init() {
            applyConfig();
            escucharFirebase(); 
            escucharHero();
            escucharConfigGlobal(); 
            renderCarrito(); // Inicializa el carrito vacío en pantalla
        }

        // --- FIREBASE CLOUD LISTENERS (SOLO LECTURA) ---
        function escucharConfigGlobal() {
            db.collection("config").doc("global").onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    config.slogan = data.slogan || config.slogan;
                    config.aboutTitle = data.aboutTitle || config.aboutTitle;
                    config.aboutDesc = data.aboutDesc || config.aboutDesc;
                    config.whatsapp = data.whatsapp || config.whatsapp;
                    config.instagram = data.instagram || config.instagram;
                    config.facebook = data.facebook || config.facebook;
                    if (data.categories && Array.isArray(data.categories)) {
                        config.categories = data.categories;
                    }
                    applyConfig();
                    renderFilters(); 
                } else {
                    console.log("ℹ️ Configuración global aún no creada por el admin. Usando por defecto.");
                    applyConfig();
                    renderFilters();
                }
            }, (error) => {
                console.error("❌ Error conectando Config Global:", error);
            });
        }

        function escucharFirebase() {
            db.collection("productos").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                inventario = snapshot.docs.map(doc => ({
                    id: doc.id,
                    ...doc.data()
                }));
                renderGallery();
            }, (error) => {
                console.error("❌ Error Firebase:", error);
                document.getElementById('gallery-grid').innerHTML = '<p class="col-span-full text-center text-red-500 uppercase tracking-widest text-[10px]">Error al cargar catálogo.</p>';
            });
        }

        function escucharHero() {
            db.collection("config").doc("hero")
            .onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    config.heroTitle = data.heroTitle || config.heroTitle;
                    config.heroSubtitle = data.heroSubtitle || config.heroSubtitle;
                    config.heroImage = data.heroImage || config.heroImage;
                    applyConfig();
                }
            }, (error) => {
                console.error("❌ Error escuchando hero:", error);
            });
        }

        // --- NAVEGACIÓN UI ---
        function showSection(id) {
            document.querySelectorAll('.section-fade').forEach(s => {
                s.classList.remove('active');
                s.style.display = 'none';
            });
            const target = document.getElementById(id);
            if(target) {
                target.style.display = 'block';
                setTimeout(() => target.classList.add('active'), 50);
            }
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        // --- RENDERIZADO VISUAL ---
        function renderGallery() {
            const grid = document.getElementById('gallery-grid');
            if(!grid) return;
            
            if(inventario.length === 0) {
                 grid.innerHTML = '<div class="col-span-full text-center py-20"><i class="fas fa-box-open text-4xl text-white/10 mb-4 block"></i><p class="text-gray-600 uppercase tracking-widest text-[10px] font-bold">Catálogo vacío por el momento</p></div>';
            } else {
                grid.innerHTML = inventario.map(prod => {
                    const coverImg = prod.imagenes && prod.imagenes.length > 0 ? prod.imagenes[0] : prod.imagen;
                    
                    return `
                    <div class="gallery-item group cursor-pointer animate-in fade-in duration-500" data-category="${prod.categoria}">
                        <div class="relative aspect-[3/4] overflow-hidden bg-darker border border-white/5 shadow-2xl">
                            <img src="${coverImg}" loading="lazy" alt="${prod.titulo}" class="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-105">
                            <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition-opacity duration-500 pointer-events-none"></div>
                            
                            ${prod.imagenes && prod.imagenes.length > 1 ? `<div class="absolute top-2 right-2 bg-dark/70 text-white text-[9px] px-2 py-1 rounded font-bold"><i class="fas fa-clone"></i> ${prod.imagenes.length}</div>` : ''}

                            <div class="absolute bottom-4 left-4 right-4 translate-y-12 group-hover:translate-y-0 transition-transform duration-500 ease-out">
                                <button onclick="openModalById('${prod.id}')" class="w-full bg-white text-dark py-3 font-bold uppercase text-[10px] tracking-widest hover:bg-primary transition-colors shadow-lg">Ver Detalles</button>
                            </div>
                        </div>
                        <div class="mt-4 flex justify-between items-start">
                            <div>
                                <h3 class="text-white font-medium uppercase tracking-widest text-sm truncate pr-2">${prod.titulo}</h3>
                                <p class="text-gray-500 text-[9px] uppercase font-bold mt-1">${prod.sku ? prod.sku + ' | ' : ''}${prod.categoria}</p>
                            </div>
                            <span class="text-primary font-bold whitespace-nowrap">${prod.precio}</span>
                        </div>
                    </div>
                `}).join('');
            }
            renderFilters();
        }

        function renderFilters() {
            const filters = document.getElementById('filter-container');
            if(!filters) return;
            
            const catsToUse = config.categories || [];
            filters.innerHTML = `
                <button onclick="filterGallery('all', event)" class="filter-btn text-primary border-b border-primary pb-1 transition-all font-bold">Todos</button>
                ${catsToUse.map(cat => `
                    <button onclick="filterGallery('${cat}', event)" class="filter-btn hover:text-white pb-1 transition-all uppercase font-bold text-gray-500">${cat}</button>
                `).join('')}
            `;
        }

        function filterGallery(cat, e) {
            document.querySelectorAll('.filter-btn').forEach(b => {
                b.classList.remove('text-primary', 'border-primary', 'font-bold');
                b.classList.add('text-gray-500');
            });
            
            e.target.classList.remove('text-gray-500');
            e.target.classList.add('text-primary', 'border-primary', 'font-bold');
            
            const grid = document.getElementById('gallery-grid');
            
            grid.style.opacity = '0';
            
            setTimeout(() => {
                document.querySelectorAll('.gallery-item').forEach(item => {
                    if (cat === 'all' || item.dataset.category === cat) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
                
                grid.style.opacity = '1';
            }, 300);
        }

        // --- MANEJO DE MODAL Y CARRUSEL ---
        function openModalById(id) {
            const p = inventario.find(x => x.id === id);
            if(!p) return;
            window.lastViewedProduct = p;
            
            currentModalImages = p.imagenes && p.imagenes.length > 0 ? p.imagenes : [p.imagen];
            currentImageIndex = 0;
            updateCarouselView();

            document.getElementById('modal-title').innerText = p.titulo;
            document.getElementById('modal-sku-display').innerText = p.sku ? `SKU: ${p.sku}` : '';
            document.getElementById('modal-desc').innerText = p.descripcion;
            document.getElementById('modal-price').innerText = p.precio;
            document.getElementById('modal-cat').innerText = p.categoria;
            
            const measuresContainer = document.getElementById('modal-measures-container');
            const tallaSelectContainer = document.getElementById('modal-talla-select-container');
            
            if(p.hasMeasures && p.tallas && p.tallas.length > 0) {
                // Renderizar tabla medidas
                measuresContainer.classList.remove('hidden');
                document.getElementById('modal-measures-body').innerHTML = p.tallas.map(t => {
                    const m = p.medidas && p.medidas[t] ? p.medidas[t] : {pecho:'-', largo:'-', ancho:'-'};
                    return `<tr class="hover:bg-white/5 transition-colors"><td class="py-3 px-2 text-primary font-bold">${t}</td><td class="py-3 text-center text-gray-400 font-bold">${m.pecho}</td><td class="py-3 text-center text-gray-400 font-bold">${m.largo}</td><td class="py-3 text-center text-gray-400 font-bold">${m.ancho}</td></tr>`;
                }).join('');
                
                // Configurar selector de talla en el modal
                tallaSelectContainer.classList.remove('hidden');
                document.getElementById('modal-talla').innerHTML = '<option value="" disabled selected>Elige una talla</option>' + p.tallas.map(t => `<option value="${t}">${t}</option>`).join('');
            } else {
                measuresContainer.classList.add('hidden');
                tallaSelectContainer.classList.add('hidden');
            }
            
            document.getElementById('product-modal').classList.add('active');
        }

        function changeImage(direction) {
            currentImageIndex += direction;
            if (currentImageIndex >= currentModalImages.length) currentImageIndex = 0;
            if (currentImageIndex < 0) currentImageIndex = currentModalImages.length - 1;
            updateCarouselView();
        }

        function updateCarouselView() {
            const imgElement = document.getElementById('modal-img');
            imgElement.style.opacity = 0; 
            
            setTimeout(() => {
                imgElement.src = currentModalImages[currentImageIndex];
                imgElement.style.opacity = 1;
            }, 150);

            const prevBtn = document.getElementById('btn-prev-img');
            const nextBtn = document.getElementById('btn-next-img');
            const dotsContainer = document.getElementById('carousel-dots');

            if (currentModalImages.length > 1) {
                prevBtn.classList.remove('hidden');
                nextBtn.classList.remove('hidden');
                
                dotsContainer.innerHTML = currentModalImages.map((_, idx) => `
                    <span class="dot ${idx === currentImageIndex ? 'active' : ''}"></span>
                `).join('');
            } else {
                prevBtn.classList.add('hidden');
                nextBtn.classList.add('hidden');
                dotsContainer.innerHTML = ''; 
            }
        }

        function closeModal() { document.getElementById('product-modal').classList.remove('active'); }

        // --- LÓGICA DE MÚLTIPLES PRODUCTOS (CARRITO) ---
        function agregarAlPedido() {
            const p = window.lastViewedProduct;
            let tallaElegida = "Única";
            
            if (p.hasMeasures && p.tallas && p.tallas.length > 0) {
                const select = document.getElementById('modal-talla');
                if (!select.value) {
                    select.classList.add('border-red-500');
                    setTimeout(() => select.classList.remove('border-red-500'), 1500);
                    return alert("Por favor, selecciona una talla antes de añadir el producto.");
                }
                tallaElegida = select.value;
            }

            // Añadir al arreglo del carrito
            carrito.push({
                id: p.id,
                titulo: p.titulo,
                sku: p.sku || '',
                precio: p.precio,
                talla: tallaElegida,
                img: p.imagenes && p.imagenes.length > 0 ? p.imagenes[0] : p.imagen
            });

            // Animación del botón del modal
            const btn = document.getElementById('btn-add-cart');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fas fa-check"></i> ¡Añadido!`;
            btn.classList.add('bg-white');
            
            renderCarrito(); // Actualiza la lista y contadores visuales

            setTimeout(() => {
                btn.innerHTML = originalHTML;
                btn.classList.remove('bg-white');
                closeModal();
            }, 1000);
        }

        function eliminarDelPedido(index) {
            carrito.splice(index, 1);
            renderCarrito();
        }

        function renderCarrito() {
            // Actualizar contadores del header
            document.getElementById('cart-count').innerText = carrito.length;
            document.getElementById('cart-count-mobile').innerText = carrito.length;
            
            const container = document.getElementById('carrito-list');
            if (carrito.length === 0) {
                container.innerHTML = `
                <div class="text-center py-6 border border-dashed border-white/10">
                    <i class="fas fa-shopping-bag text-2xl text-white/10 mb-2"></i>
                    <p class="text-gray-500 text-[10px] uppercase tracking-widest font-bold">Tu carrito está vacío</p>
                </div>`;
                return;
            }

            container.innerHTML = carrito.map((item, index) => `
                <div class="flex items-center gap-4 bg-darker border border-white/5 p-3 rounded group relative">
                    <div class="w-12 h-12 bg-dark rounded border border-white/10 overflow-hidden shrink-0">
                        <img src="${item.img}" class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="text-white text-[11px] font-bold uppercase truncate">${item.titulo}</p>
                        <p class="text-gray-500 text-[9px] uppercase mt-0.5">Talla: <span class="text-primary font-bold">${item.talla}</span> ${item.sku ? `| SKU: ${item.sku}` : ''}</p>
                    </div>
                    <button onclick="eliminarDelPedido(${index})" class="text-red-500 hover:text-red-400 bg-red-500/10 w-8 h-8 rounded shrink-0 transition-colors">
                        <i class="fas fa-trash-alt"></i>
                    </button>
                </div>
            `).join('');
        }

        // --- WHATSAPP CON CARRITO MÚLTIPLE ---
        function enviarWhatsApp() {
            const n = document.getElementById('nombre').value.trim();
            const m = document.getElementById('mensaje').value.trim();
            
            if(!n) return alert("Por favor, ingresa tu Nombre Completo.");
            if(carrito.length === 0) return alert("Tu selección está vacía. Añade productos desde el catálogo antes de enviar el pedido.");
            
            const btnText = document.getElementById('btn-wa-text');
            const originalText = btnText.innerText;
            btnText.innerText = "Procesando...";
            
            // Construcción del mensaje para WhatsApp
            let msg = `🔥 *NUEVO PEDIDO NEW GATE* 🔥\n\n`;
            msg += `👤 *Cliente:* ${n}\n\n`;
            msg += `🛍️ *PRODUCTOS SELECCIONADOS:*\n`;
            
            carrito.forEach((item, index) => {
                msg += `${index + 1}. ${item.titulo} ${item.sku ? `(SKU: ${item.sku})` : ''} \n   📏 Talla: *${item.talla}*\n`;
            });

            if(m) msg += `\n💬 *Mensaje Adicional:*\n_${m}_\n`;
            msg += `\n_Enviado desde el catálogo web_`;
            
            setTimeout(() => {
                window.open(`https://wa.me/${config.whatsapp}?text=${encodeURIComponent(msg)}`, '_blank');
                btnText.innerText = originalText;
                
                // Opcional: Vaciar carrito tras pedir
                // carrito = [];
                // renderCarrito();
                // document.getElementById('nombre').value = "";
                // document.getElementById('mensaje').value = "";
            }, 800);
        }

        function applyConfig() {
            document.getElementById('display-hero-title').innerText = config.heroTitle;
            document.getElementById('display-hero-subtitle').innerText = config.heroSubtitle;
            document.getElementById('hero-display').style.backgroundImage = `url('${config.heroImage}')`;
            
            document.getElementById('display-shop-slogan').innerText = config.slogan;
            document.getElementById('display-about-title').innerText = config.aboutTitle;
            document.getElementById('display-about-desc').innerText = config.aboutDesc;
            
            const waLink = document.getElementById('link-whatsapp');
            if(waLink) waLink.href = `https://wa.me/${config.whatsapp}`;
            
            const igLink = document.getElementById('link-instagram');
            if(igLink) {
                igLink.href = config.instagram !== "#" ? config.instagram : "#";
                igLink.style.display = config.instagram === "#" || !config.instagram ? "none" : "inline-block";
            }
            
            const fbLink = document.getElementById('link-facebook');
            if(fbLink) {
                fbLink.href = config.facebook !== "#" ? config.facebook : "#";
                fbLink.style.display = config.facebook === "#" || !config.facebook ? "none" : "inline-block";
            }
        }

        window.onload = init;
    </script>
</body>
</html>
