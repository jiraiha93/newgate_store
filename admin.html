<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEW GATE | Admin Panel</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#d4af37', dark: '#0a0a0a', darker: '#050505' },
                    fontFamily: { sans: ['"Inter"', 'sans-serif'], serif: ['"Playfair Display"', 'serif'], graffiti: ['"Permanent Marker"', 'cursive'] }
                }
            }
        }
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Permanent+Marker&display=swap');
        .loader { border: 3px solid rgba(212, 175, 55, 0.3); border-radius: 50%; border-top: 3px solid #d4af37; width: 24px; height: 24px; animation: spin 1s linear infinite; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .admin-tab { display: none; }
        .admin-tab.active { display: block; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-dark text-gray-300 font-sans antialiased">

    <!-- LOGIN OVERLAY -->
    <div id="login-overlay" class="fixed inset-0 bg-darker z-[1000] flex items-center justify-center p-6">
        <div class="max-w-md w-full bg-dark p-10 border border-white/5 rounded-lg shadow-2xl">
            <div class="font-graffiti text-4xl text-white text-center mb-8 italic">NEW GATE <span class="text-primary">ADMIN</span></div>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] uppercase text-gray-500 tracking-widest mb-2 block font-bold">Email de Acceso</label>
                    <input type="email" id="login-email" placeholder="admin@newgate.com" class="w-full bg-darker border border-white/10 px-6 py-4 outline-none focus:border-primary text-white text-sm transition-colors rounded">
                </div>
                <div>
                    <label class="text-[10px] uppercase text-gray-500 tracking-widest mb-2 block font-bold">Contraseña</label>
                    <input type="password" id="login-password" placeholder="••••••••" class="w-full bg-darker border border-white/10 px-6 py-4 outline-none focus:border-primary text-white text-sm transition-colors rounded">
                </div>
                <button onclick="loginAdmin()" class="w-full py-5 bg-primary text-dark font-bold uppercase tracking-[0.2em] hover:bg-white transition-all shadow-xl shadow-primary/10">Entrar al Panel</button>
            </div>
        </div>
    </div>

    <!-- PANEL PRINCIPAL (Oculto hasta login) -->
    <div id="admin-panel" class="hidden min-h-screen flex flex-col md:flex-row">
        
        <!-- SIDEBAR -->
        <aside class="w-full md:w-64 bg-darker border-r border-white/5 p-6 flex flex-col gap-8">
            <div class="font-graffiti text-2xl text-white italic tracking-wider">NEW GATE<span class="text-primary">.</span></div>
            
            <nav class="flex flex-col gap-2">
                <button onclick="switchTab('pedidos')" class="tab-btn active w-full text-left px-4 py-3 rounded text-[10px] uppercase tracking-widest font-bold transition-all flex items-center justify-between group">
                    <span><i class="fas fa-clipboard-list mr-2 text-primary"></i> Pedidos</span>
                    <span id="badge-pedidos" class="bg-red-600 text-white px-2 py-0.5 rounded-full text-[9px] hidden">0</span>
                </button>
                <button onclick="switchTab('inventario')" class="tab-btn w-full text-left px-4 py-3 rounded text-[10px] uppercase tracking-widest font-bold transition-all flex items-center group">
                    <i class="fas fa-box mr-2 text-primary"></i> Inventario
                </button>
                <button onclick="switchTab('configuracion')" class="tab-btn w-full text-left px-4 py-3 rounded text-[10px] uppercase tracking-widest font-bold transition-all flex items-center group">
                    <i class="fas fa-cog mr-2 text-primary"></i> Tienda
                </button>
            </nav>

            <div class="mt-auto pt-6 border-t border-white/5">
                <button onclick="logoutAdmin()" class="w-full bg-red-900/20 text-red-400 border border-red-500/20 py-3 text-[10px] font-bold uppercase tracking-widest hover:bg-red-500 hover:text-white transition-all rounded">
                    Cerrar Sesión
                </button>
            </div>
        </aside>

        <!-- CONTENIDO -->
        <main class="flex-1 p-6 md:p-12 max-h-screen overflow-y-auto">
            
            <!-- TAB PEDIDOS -->
            <div id="tab-pedidos" class="admin-tab active">
                <div class="bg-dark p-6 border border-white/5 rounded-lg mb-10 shadow-2xl">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
                        <div>
                            <h3 class="text-primary uppercase tracking-[0.3em] text-xs font-bold italic flex items-center gap-2">
                                <i class="fas fa-shopping-cart"></i> Pedidos Entrantes
                            </h3>
                            <p class="text-[10px] text-gray-500 uppercase tracking-widest mt-1">Busca pedidos por número (NG-XXXX) o nombre.</p>
                        </div>
                        
                        <!-- BARRA DE BÚSQUEDA -->
                        <div class="relative w-full md:w-80">
                            <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500"></i>
                            <input type="text" id="search-pedidos" placeholder="Buscar: NG-1234, Juan..." class="w-full bg-darker border border-white/10 pl-10 pr-4 py-3 text-sm focus:border-primary outline-none text-white rounded transition-colors" oninput="renderPedidosList()">
                        </div>
                    </div>
                    
                    <div id="admin-pedidos-list" class="space-y-4">
                        <div class="text-center py-20"><div class="loader !block border-t-primary w-8 h-8 mx-auto"></div></div>
                    </div>
                </div>
            </div>

            <!-- TAB INVENTARIO (Simplificado para brevedad, mantén tu lógica de agregar productos aquí) -->
            <div id="tab-inventario" class="admin-tab">
                 <h3 class="text-primary uppercase tracking-[0.3em] text-xs font-bold mb-6 italic">Gestión de Stock</h3>
                 <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4" id="admin-products-list"></div>
            </div>

            <!-- TAB CONFIGURACION (Aquí va el resto de tu configuración de tienda) -->
            <div id="tab-configuracion" class="admin-tab">
                <h3 class="text-primary uppercase tracking-[0.3em] text-xs font-bold mb-6 italic">Ajustes Globales</h3>
                <!-- Formulario de configuración... -->
            </div>

        </main>
    </div>

    <script>
        const DarkAlert = Swal.mixin({
            background: '#0a0a0a', color: '#fff', confirmButtonColor: '#d4af37', cancelButtonColor: '#1a1a1a',
            customClass: { popup: 'border border-white/10 rounded-none shadow-2xl', title: 'font-serif italic', confirmButton: 'uppercase tracking-widest text-[10px] py-3 px-8 rounded-none', cancelButton: 'uppercase tracking-widest text-[10px] py-3 px-8 rounded-none' }
        });

        const Toast = Swal.mixin({ toast: true, position: 'top', showConfirmButton: false, timer: 3000, background: '#0f0f0f', color: '#fff' });

        let inventario = [];
        let pedidosList = [];
        let config = {};

        // --- AUTH ---
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('login-overlay').classList.add('hidden');
                document.getElementById('admin-panel').classList.remove('hidden');
                init();
            } else {
                document.getElementById('login-overlay').classList.remove('hidden');
                document.getElementById('admin-panel').classList.add('hidden');
            }
        });

        function loginAdmin() {
            const e = document.getElementById('login-email').value;
            const p = document.getElementById('login-password').value;
            auth.signInWithEmailAndPassword(e, p).catch(err => Toast.fire({ icon: 'error', title: 'Acceso denegado' }));
        }

        function logoutAdmin() { auth.signOut(); }

        function init() {
            escucharPedidos();
            escucharInventario();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.admin-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('bg-primary/10', 'text-primary'));
            document.getElementById(`tab-${tabId}`).classList.add('active');
            event.currentTarget.classList.add('bg-primary/10', 'text-primary');
        }

        // --- LÓGICA PEDIDOS ---
        function escucharPedidos() {
            db.collection("pedidos").orderBy("createdAt", "desc").onSnapshot((snapshot) => {
                pedidosList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                renderPedidosList();
            }, (error) => {
                console.error("Error pedidos:", error);
                Toast.fire({ icon: 'error', title: 'Error al cargar pedidos. Revisa reglas de Firebase.' });
            });
        }

        function renderPedidosList() {
            const list = document.getElementById('admin-pedidos-list');
            const badge = document.getElementById('badge-pedidos');
            const term = document.getElementById('search-pedidos').value.toLowerCase().trim();
            
            const filtered = pedidosList.filter(p => 
                (p.idPedido || "").toLowerCase().includes(term) || 
                (p.cliente || "").toLowerCase().includes(term)
            );

            badge.innerText = pedidosList.length;
            badge.classList.toggle('hidden', pedidosList.length === 0);

            if(filtered.length === 0) {
                list.innerHTML = `<div class="text-center py-20 border border-dashed border-white/5 rounded"><p class="text-gray-600 uppercase text-[10px] font-bold">No hay pedidos pendientes</p></div>`;
                return;
            }

            list.innerHTML = filtered.map(pedido => {
                const fecha = (pedido.createdAt && pedido.createdAt.toDate) ? pedido.createdAt.toDate().toLocaleString() : 'Recién llegado';
                
                return `
                <div class="bg-darker border border-white/10 p-5 rounded-lg flex flex-col md:flex-row justify-between gap-6 relative overflow-hidden group">
                    <div class="absolute left-0 top-0 bottom-0 w-1 bg-primary"></div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center mb-3 border-b border-white/5 pb-2">
                            <span class="text-primary font-bold uppercase tracking-widest text-[11px]">ID: ${pedido.idPedido || 'S/N'}</span>
                            <span class="text-gray-600 text-[9px] font-bold uppercase tracking-tighter">${fecha}</span>
                        </div>
                        <h4 class="text-white font-bold uppercase text-sm mb-2"><i class="fas fa-user-circle text-gray-500 mr-2"></i>${pedido.cliente}</h4>
                        ${pedido.mensaje ? `<p class="text-gray-400 text-[10px] italic bg-white/5 p-2 rounded mb-4 border-l-2 border-primary">"${pedido.mensaje}"</p>` : ''}
                        
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                            ${pedido.items.map(i => `
                                <div class="flex items-center gap-3 bg-dark p-2 border border-white/5 rounded">
                                    <img src="${i.img}" class="w-10 h-10 object-cover rounded bg-darker">
                                    <div class="min-w-0">
                                        <p class="text-white text-[9px] font-bold uppercase truncate">${i.titulo}</p>
                                        <p class="text-gray-500 text-[8px] uppercase">Talla: <span class="text-primary">${i.talla}</span> | Cant: <span class="text-white">x${i.cantidad}</span></p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                    <div class="flex flex-col items-end justify-center gap-3 min-w-[140px]">
                        <p class="text-2xl font-serif text-white font-bold">L${pedido.total.toFixed(2)}</p>
                        <button onclick="despacharPedido('${pedido.id}')" class="w-full bg-green-900/20 text-green-400 border border-green-500/30 py-3 rounded text-[10px] font-bold uppercase tracking-widest hover:bg-green-500 hover:text-white transition-all flex items-center justify-center gap-2">
                            <i class="fas fa-truck-loading"></i> Despachar
                        </button>
                    </div>
                </div>
                `;
            }).join('');
        }

        function despacharPedido(docId) {
            const p = pedidosList.find(x => x.id === docId);
            if(!p) return;

            DarkAlert.fire({
                title: 'Confirmar Despacho',
                text: `Se rebajará el stock de ${p.items.length} productos y el pedido se archivará.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonText: 'Confirmar y Rebajar Stock'
            }).then(result => {
                if(result.isConfirmed) {
                    const batch = db.batch();
                    
                    // Lógica de rebaje de inventario
                    p.items.forEach(item => {
                        const prodRef = db.collection("productos").doc(item.id);
                        const enInv = inventario.find(inv => inv.id === item.id);
                        if(enInv) {
                            const nuevoStock = Math.max(0, (enInv.stock || 0) - item.cantidad);
                            batch.update(prodRef, { stock: nuevoStock });
                        }
                    });

                    // Borrar el pedido despachado
                    batch.delete(db.collection("pedidos").doc(docId));

                    batch.commit().then(() => {
                        Toast.fire({ icon: 'success', title: 'Pedido despachado y stock actualizado' });
                    }).catch(e => {
                        DarkAlert.fire({ icon: 'error', title: 'Error en proceso', text: e.message });
                    });
                }
            });
        }

        function escucharInventario() {
            db.collection("productos").onSnapshot(snap => {
                inventario = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Aquí llamarías a tu función de renderizado de productos del admin
            });
        }

    </script>
</body>
</html>
